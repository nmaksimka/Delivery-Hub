app:
  outbox:
    poll-interval: 1s
    batch-size: 50
    send-timeout: 5s
    max-attempts: 5
    retry-backoff: 2s
    max-backoff: 1m
  kafka:
    topics:
      partitions: 3
      replicas: 1
      retention: 7d
      dead-letter-retention: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
