app:
  rate-limit:
    common:
      replenish-rate: 20
      burst-capacity: 40
    login:
      replenish-rate: 1
      burst-capacity: 5

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /docs/users/v3/api-docs
      - name: restaurant-service
        url: /docs/restaurants/v3/api-docs
      - name: order-service
        url: /docs/orders/v3/api-docs
      - name: delivery-service
        url: /docs/deliveries/v3/api-docs
