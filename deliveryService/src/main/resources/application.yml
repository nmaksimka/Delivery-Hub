server:
  port: 3333

spring:
  application:
    name: deliveryService
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:local-dev-config-password}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5333}/${DB_NAME:delivery_db}
    username: ${DB_USER:delivery_user}
    password: ${DB_PASSWORD:delivery_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
    consumer:
      group-id: delivery-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      avro.use.logical.type.converters: true

app:
  internal-token: ${INTERNAL_TOKEN:local-dev-internal-token}
  dispatch:
    zone-radius-meters: ${DISPATCH_ZONE_RADIUS_METERS:5000}
  routing:
    base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
    profile: car
    user-agent: DeliveryHub/1.0 (+https://github.com/nmaksimka/Delivery-Hub)
    connect-timeout: 1s
    read-timeout: 2s
    fallback-detour-factor: 1.4
    fallback-speed-kmh: 25
  weather:
    base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
    latitude: 56.4977
    longitude: 84.9744
    connect-timeout: 1s
    read-timeout: 2s
    cache-ttl: 10m
    frost-below-celsius: -25
  pricing:
    base-fee: 99
    per-km: 15
    weather:
      RAIN:
        surcharge: 39
        eta-percent: 15
      SNOW:
        surcharge: 49
        eta-percent: 25
      FROST:
        surcharge: 59
        eta-percent: 20
  simulator:
    enabled: ${TRACKING_SIMULATOR_ENABLED:false}
    tick: 2s
    speed-kmh: 30
    pickup-delay: 15s
  outbox:
    poll-interval: 1s
    batch-size: 50
    send-timeout: 5s
    max-attempts: 5
    retry-backoff: 2s
    max-backoff: 1m
  cleanup:
    interval: 1h
    outbox-retention: 7d
    processed-events-retention: 14d
  kafka:
    topics:
      partitions: 3
      replicas: 1
      retention: 7d
      dead-letter-retention: 30d

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:local-dev-eureka-password}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
