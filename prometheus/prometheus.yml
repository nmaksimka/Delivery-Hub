global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: deliveryhub-services
    metrics_path: /actuator/prometheus
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):\\d+"
        target_label: service
    static_configs:
      - targets:
          - restaurantService:3331
          - orderService:3332
          - deliveryService:3333
          - userService:3334
          - paymentService:3336
        labels:
          system: deliveryhub

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):\\d+"
        target_label: service
    static_configs:
      - targets:
          - apiGateway:9335
        labels:
          system: deliveryhub

  - job_name: platform
    metrics_path: /actuator/prometheus
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):\\d+"
        target_label: service
    static_configs:
      - targets:
          - discoveryServer:8761
          - configServer:8888
        labels:
          system: deliveryhub
