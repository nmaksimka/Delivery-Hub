server:
  port: 3335

app:
  jwt:
    jwk-set-uri: ${JWT_JWK_SET_URI:http://userService/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:deliveryhub}
  internal-token: ${INTERNAL_TOKEN:local-dev-internal-token}
  request-body:
    max-size: 7MB
  rate-limit:
    common:
      replenish-rate: 20
      burst-capacity: 40
    login:
      replenish-rate: 1
      burst-capacity: 5
      requested-tokens: 1

spring:
  application:
    name: apiGateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:local-dev-config-password}
    inetutils:
      ignored-interfaces:
        - .*
    discovery:
      client:
        simple:
          instances:
            restaurantService:
              - uri: http://localhost:3331
            orderService:
              - uri: http://localhost:3332
            deliveryService:
              - uri: http://localhost:3333
            userService:
              - uri: http://localhost:3334
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${app.rate-limit.common.replenish-rate}
                redis-rate-limiter.burstCapacity: ${app.rate-limit.common.burst-capacity}
                key-resolver: "#{@userOrIpKeyResolver}"
          routes:
            - id: auth-login
              uri: lb://userService
              predicates:
                - Path=/api/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${app.rate-limit.login.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${app.rate-limit.login.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${app.rate-limit.login.requested-tokens}
                    key-resolver: "#{@loginAttemptKeyResolver}"
            - id: restaurant-service
              uri: lb://restaurantService
              predicates:
                - Path=/api/restaurants/**
            - id: catalog-import
              uri: lb://restaurantService
              predicates:
                - Path=/api/admin/imports/**
            - id: restaurant-owners
              uri: lb://restaurantService
              predicates:
                - Path=/api/admin/restaurants/**
            - id: restaurant-cabinet
              uri: lb://restaurantService
              predicates:
                - Path=/api/cabinet/**
            - id: user-admin
              uri: lb://userService
              predicates:
                - Path=/api/admin/users/**
            - id: order-service
              uri: lb://orderService
              predicates:
                - Path=/api/orders/**
            - id: cart
              uri: lb://orderService
              predicates:
                - Path=/api/cart/**
            - id: promo-admin
              uri: lb://orderService
              predicates:
                - Path=/api/admin/promo-codes/**
            - id: delivery-service
              uri: lb://deliveryService
              predicates:
                - Path=/api/deliveries/**
            - id: user-service
              uri: lb://userService
              predicates:
                - Path=/api/auth/**
            - id: restaurant-docs
              uri: lb://restaurantService
              predicates:
                - Path=/docs/restaurants/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: order-docs
              uri: lb://orderService
              predicates:
                - Path=/docs/orders/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: delivery-docs
              uri: lb://deliveryService
              predicates:
                - Path=/docs/deliveries/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: user-docs
              uri: lb://userService
              predicates:
                - Path=/docs/users/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:local-dev-eureka-password}@localhost:8761/eureka/

management:
  server:
    port: 9335
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /docs/users/v3/api-docs
      - name: restaurant-service
        url: /docs/restaurants/v3/api-docs
      - name: order-service
        url: /docs/orders/v3/api-docs
      - name: delivery-service
        url: /docs/deliveries/v3/api-docs
