server:
  port: 3335

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-change-me-at-least-32-bytes-long}

spring:
  application:
    name: apiGateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    inetutils:
      ignored-interfaces:
        - .*
    discovery:
      client:
        simple:
          instances:
            restaurantService:
              - uri: http://localhost:3331
            orderService:
              - uri: http://localhost:3332
            deliveryService:
              - uri: http://localhost:3333
            userService:
              - uri: http://localhost:3334
    gateway:
      server:
        webflux:
          routes:
            - id: restaurant-service
              uri: lb://restaurantService
              predicates:
                - Path=/api/restaurants/**
            - id: order-service
              uri: lb://orderService
              predicates:
                - Path=/api/orders/**
            - id: delivery-service
              uri: lb://deliveryService
              predicates:
                - Path=/api/deliveries/**
            - id: user-service
              uri: lb://userService
              predicates:
                - Path=/api/auth/**
            - id: restaurant-docs
              uri: lb://restaurantService
              predicates:
                - Path=/docs/restaurants/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: order-docs
              uri: lb://orderService
              predicates:
                - Path=/docs/orders/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: delivery-docs
              uri: lb://deliveryService
              predicates:
                - Path=/docs/deliveries/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: user-docs
              uri: lb://userService
              predicates:
                - Path=/docs/users/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

management:
  server:
    port: 9335
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /docs/users/v3/api-docs
      - name: restaurant-service
        url: /docs/restaurants/v3/api-docs
      - name: order-service
        url: /docs/orders/v3/api-docs
      - name: delivery-service
        url: /docs/deliveries/v3/api-docs
