# JWT_SECRET и пароли БД берутся из .env (см. .env.example).
name: deliveryhub

x-postgres-healthcheck: &pg-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # 29092 наружу — чтобы сервисы можно было запускать локально, вне docker
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  postgres-restaurant:
    image: postgres:16-alpine
    container_name: postgres-restaurant
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ${RESTAURANT_DB_PASSWORD:-restaurant_pass}
    ports:
      - "5331:5432"
    volumes:
      - pg-restaurant-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
    ports:
      - "5332:5432"
    volumes:
      - pg-order-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  postgres-delivery:
    image: postgres:16-alpine
    container_name: postgres-delivery
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD:-delivery_pass}
    ports:
      - "5333:5432"
    volumes:
      - pg-delivery-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_pass}
    ports:
      - "5334:5432"
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  # --- Бизнес-сервисы -------------------------------------------------------
  # Порты наружу НЕ публикуются: единственная точка входа — apiGateway.
  # Иначе авторизацию гейтвея можно обойти, постучавшись напрямую в сервис.

  restaurantService:
    image: deliveryhub-restaurant-service
    build:
      context: .
      dockerfile: ./restaurantService/Dockerfile
    container_name: restaurantService
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${RESTAURANT_DB_PASSWORD:-restaurant_pass}
    depends_on:
      postgres-restaurant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3331/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  orderService:
    image: deliveryhub-order-service
    build:
      context: .
      dockerfile: ./orderService/Dockerfile
    container_name: orderService
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      restaurantService:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3332/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  deliveryService:
    image: deliveryhub-delivery-service
    build:
      context: .
      dockerfile: ./deliveryService/Dockerfile
    container_name: deliveryService
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DELIVERY_DB_PASSWORD:-delivery_pass}
    depends_on:
      postgres-delivery:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  userService:
    image: deliveryhub-user-service
    build:
      context: .
      dockerfile: ./userService/Dockerfile
    container_name: userService
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${USER_DB_PASSWORD:-user_pass}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
    depends_on:
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3334/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  apiGateway:
    image: deliveryhub-api-gateway
    build:
      context: .
      dockerfile: ./apiGateway/Dockerfile
    container_name: apiGateway
    ports:
      - "3335:3335"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
    depends_on:
      restaurantService:
        condition: service_healthy
      orderService:
        condition: service_healthy
      deliveryService:
        condition: service_healthy
      userService:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - apiGateway

volumes:
  pg-restaurant-data:
  pg-order-data:
  pg-delivery-data:
  pg-user-data:
