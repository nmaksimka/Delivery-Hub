name: deliveryhub

x-postgres-healthcheck: &pg-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.4
    container_name: schema-registry
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: deliveryhub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  postgres-restaurant:
    image: postgres:17.9-alpine
    container_name: postgres-restaurant
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ${RESTAURANT_DB_PASSWORD:-restaurant_pass}
    ports:
      - "5331:5432"
    volumes:
      - pg-restaurant-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  postgres-order:
    image: postgres:17.9-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
    ports:
      - "5332:5432"
    volumes:
      - pg-order-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  postgres-delivery:
    image: postgres:17.9-alpine
    container_name: postgres-delivery
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD:-delivery_pass}
    ports:
      - "5333:5432"
    volumes:
      - pg-delivery-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  postgres-user:
    image: postgres:17.9-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_pass}
    ports:
      - "5334:5432"
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  restaurantService:
    image: deliveryhub-restaurant-service
    build:
      context: .
      dockerfile: ./restaurantService/Dockerfile
    container_name: restaurantService
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${RESTAURANT_DB_PASSWORD:-restaurant_pass}
    depends_on:
      postgres-restaurant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3331/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  orderService:
    image: deliveryhub-order-service
    build:
      context: .
      dockerfile: ./orderService/Dockerfile
    container_name: orderService
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      restaurantService:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3332/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  deliveryService:
    image: deliveryhub-delivery-service
    build:
      context: .
      dockerfile: ./deliveryService/Dockerfile
    container_name: deliveryService
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DELIVERY_DB_PASSWORD:-delivery_pass}
    depends_on:
      postgres-delivery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  userService:
    image: deliveryhub-user-service
    build:
      context: .
      dockerfile: ./userService/Dockerfile
    container_name: userService
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${USER_DB_PASSWORD:-user_pass}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
    depends_on:
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3334/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  apiGateway:
    image: deliveryhub-api-gateway
    build:
      context: .
      dockerfile: ./apiGateway/Dockerfile
    container_name: apiGateway
    ports:
      - "3335:3335"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
    depends_on:
      restaurantService:
        condition: service_healthy
      orderService:
        condition: service_healthy
      deliveryService:
        condition: service_healthy
      userService:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - apiGateway

volumes:
  kafka-data:
  pg-restaurant-data:
  pg-order-data:
  pg-delivery-data:
  pg-user-data:
