name: deliveryhub

x-postgres-healthcheck: &pg-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  interval: 5s
  timeout: 5s
  retries: 10

x-platform-credentials: &platform-credentials
  CONFIG_SERVER_URL: http://configServer:8888
  CONFIG_USER: ${CONFIG_USER:-config}
  CONFIG_PASSWORD: ${CONFIG_PASSWORD:?CONFIG_PASSWORD is required, see .env.example}
  EUREKA_USER: ${EUREKA_USER:-eureka}
  EUREKA_PASSWORD: ${EUREKA_PASSWORD:?EUREKA_PASSWORD is required, see .env.example}

x-json-logs: &json-logs
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

x-storage-credentials: &storage-credentials
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-GK0123456789abcdef01234567}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-images}

services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.4
    container_name: schema-registry
    ports:
      - "127.0.0.1:8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: deliveryhub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  redis:
    image: redis:8.6.3-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-4f3c9a1e7b2d58606e1a9c34d7f0b2a85c61e93d4a7f208b1c5e6d9a3f4b7c10}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-local-dev-garage-admin-token}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  garageInit:
    image: curlimages/curl:8.14.1
    container_name: garageInit
    entrypoint: ["sh", "/init.sh"]
    environment:
      <<: *storage-credentials
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-local-dev-garage-admin-token}
    volumes:
      - ./garage/init.sh:/init.sh:ro
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"

  postgres-restaurant:
    image: postgres:17.9-alpine
    container_name: postgres-restaurant
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ${RESTAURANT_DB_PASSWORD:-restaurant_pass}
    volumes:
      - pg-restaurant-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  postgres-order:
    image: postgres:17.9-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
    volumes:
      - pg-order-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  postgres-delivery:
    image: postgres:17.9-alpine
    container_name: postgres-delivery
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD:-delivery_pass}
    volumes:
      - pg-delivery-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  postgres-user:
    image: postgres:17.9-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_pass}
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck

  discoveryServer:
    image: deliveryhub-discovery-server
    build:
      context: .
      dockerfile: ./discoveryServer/Dockerfile
    container_name: discoveryServer
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      <<: *json-logs
      EUREKA_HOSTNAME: discoveryServer
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?EUREKA_PASSWORD is required, see .env.example}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  configServer:
    image: deliveryhub-config-server
    build:
      context: .
      dockerfile: ./configServer/Dockerfile
    container_name: configServer
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      <<: *json-logs
      CONFIG_REPO_LOCATION: file:/config-repo
      CONFIG_USER: ${CONFIG_USER:-config}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:?CONFIG_PASSWORD is required, see .env.example}
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  restaurantService:
    image: deliveryhub-restaurant-service
    build:
      context: .
      dockerfile: ./restaurantService/Dockerfile
    container_name: restaurantService
    expose:
      - "9331"
    environment:
      <<: [*platform-credentials, *json-logs, *storage-credentials]
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${RESTAURANT_DB_PASSWORD:-restaurant_pass}
      STORAGE_ENDPOINT: http://garage:3900
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:3900}
    depends_on:
      garageInit:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      configServer:
        condition: service_healthy
      discoveryServer:
        condition: service_healthy
      postgres-restaurant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3331/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  orderService:
    image: deliveryhub-order-service
    build:
      context: .
      dockerfile: ./orderService/Dockerfile
    container_name: orderService
    environment:
      <<: [*platform-credentials, *json-logs]
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
    depends_on:
      configServer:
        condition: service_healthy
      discoveryServer:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      restaurantService:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3332/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  deliveryService:
    image: deliveryhub-delivery-service
    build:
      context: .
      dockerfile: ./deliveryService/Dockerfile
    container_name: deliveryService
    environment:
      <<: [*platform-credentials, *json-logs]
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DELIVERY_DB_PASSWORD:-delivery_pass}
    depends_on:
      configServer:
        condition: service_healthy
      discoveryServer:
        condition: service_healthy
      postgres-delivery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  userService:
    image: deliveryhub-user-service
    build:
      context: .
      dockerfile: ./userService/Dockerfile
    container_name: userService
    environment:
      <<: [*platform-credentials, *json-logs]
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${USER_DB_PASSWORD:-user_pass}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    depends_on:
      configServer:
        condition: service_healthy
      discoveryServer:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3334/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  apiGateway:
    image: deliveryhub-api-gateway
    build:
      context: .
      dockerfile: ./apiGateway/Dockerfile
    container_name: apiGateway
    ports:
      - "3335:3335"
    environment:
      <<: [*platform-credentials, *json-logs]
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
      configServer:
        condition: service_healthy
      discoveryServer:
        condition: service_healthy
      restaurantService:
        condition: service_healthy
      orderService:
        condition: service_healthy
      deliveryService:
        condition: service_healthy
      userService:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9335/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      apiGateway:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.3
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.17.0
    container_name: alloy
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-deliveryhub}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:12.4.4
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required, see .env.example}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/services.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

volumes:
  loki-data:
  grafana-data:
  kafka-data:
  garage-meta:
  garage-data:
  pg-restaurant-data:
  pg-order-data:
  pg-delivery-data:
  pg-user-data:
