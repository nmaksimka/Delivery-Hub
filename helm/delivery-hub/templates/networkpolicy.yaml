{{- if .Values.networkPolicy.enabled }}
{{- range .Values.networkPolicy.restricted }}
{{- $svc := index $.Values.services .service }}
{{- $restricted := .port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .service }}-{{ .port }}-restricted
  labels:
    {{- include "dh.labels" (dict "name" .service "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dh.selector" (dict "name" .service "root" $) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        {{- range $svc.ports }}
        {{- if ne (int .port) (int $restricted) }}
        - port: {{ .port }}
          protocol: TCP
        {{- end }}
        {{- end }}
    - from:
        {{- range .from }}
        - podSelector:
            matchLabels:
              {{- include "dh.selector" (dict "name" . "root" $) | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ .port }}
          protocol: TCP
{{- end }}
{{- end }}
