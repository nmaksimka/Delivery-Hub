server:
  port: 3332

spring:
  application:
    name: orderService
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:local-dev-config-password}
    inetutils:
      ignored-interfaces:
        - .*
    discovery:
      client:
        simple:
          instances:
            restaurantService:
              - uri: http://localhost:3331
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true
      client:
        config:
          restaurantService:
            connect-timeout: 1000
            read-timeout: 2000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5332}/${DB_NAME:order_db}
    username: ${DB_USER:order_user}
    password: ${DB_PASSWORD:order_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      avro.use.logical.type.converters: true

resilience4j:
  circuitbreaker:
    configs:
      restaurantService:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$FeignClientException
  timelimiter:
    configs:
      restaurantService:
        timeout-duration: 3s
        cancel-running-future: true
  retry:
    instances:
      restaurantService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.deliveryhub.order.client.RestaurantServiceUnavailableException
        ignore-exceptions:
          - com.deliveryhub.order.client.RestaurantCircuitOpenException

app:
  outbox:
    poll-interval: 1s
    batch-size: 50
    send-timeout: 5s
    max-attempts: 5
    retry-backoff: 2s
    max-backoff: 1m
  cleanup:
    interval: 1h
    outbox-retention: 7d
    processed-events-retention: 14d
  kafka:
    topics:
      partitions: 3
      replicas: 1
      retention: 7d
      dead-letter-retention: 30d

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:local-dev-eureka-password}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
