server:
  port: 3332

spring:
  application:
    name: orderService
  cloud:
    inetutils:
      # Обратный DNS-запрос локального адреса на этой машине не отвечает и каждый раз
      # съедает секунду таймаута (6 секунд старта). Ни gateway, ни Feign здесь host info
      # не используют, поэтому поиск non-loopback интерфейса отключён целиком.
      ignored-interfaces:
        - .*
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5332}/${DB_NAME:order_db}
    username: ${DB_USER:order_user}
    password: ${DB_PASSWORD:order_pass}
  jpa:
    # Схемой управляет Flyway. Hibernate только сверяет с ней маппинг.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Доверяем только пакету общих контрактов, а не "*"
        spring.json.trusted.packages: com.deliveryhub.contracts.events
        spring.json.value.default.type: com.deliveryhub.contracts.events.DeliveryStatusUpdatedEvent
        spring.json.use.type.headers: false

app:
  restaurant-service:
    url: ${RESTAURANT_SERVICE_URL:http://localhost:3331}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
