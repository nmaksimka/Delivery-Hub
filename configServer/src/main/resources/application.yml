server:
  port: 8888

spring:
  application:
    name: configServer
  security:
    user:
      name: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:local-dev-config-password}
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:./config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
