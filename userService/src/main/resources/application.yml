server:
  port: 3334

spring:
  application:
    name: userService
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5334}/${DB_NAME:user_db}
    username: ${DB_USER:user_user}
    password: ${DB_PASSWORD:user_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Значение по умолчанию только для локального запуска. В docker/prod задаётся через JWT_SECRET.
    secret: ${JWT_SECRET:local-dev-secret-key-change-me-at-least-32-bytes-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
