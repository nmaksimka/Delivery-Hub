server:
  port: 3334

spring:
  application:
    name: userService
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:local-dev-config-password}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5334}/${DB_NAME:user_db}
    username: ${DB_USER:user_user}
    password: ${DB_PASSWORD:user_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    issuer: ${JWT_ISSUER:deliveryhub}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    private-key: ${JWT_PRIVATE_KEY:}
  cleanup:
    interval: 1h
    refresh-token-retention: 7d

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:local-dev-eureka-password}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
