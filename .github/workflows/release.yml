name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: discovery-server
            context: .
            dockerfile: discoveryServer/Dockerfile
          - name: config-server
            context: .
            dockerfile: configServer/Dockerfile
          - name: api-gateway
            context: .
            dockerfile: apiGateway/Dockerfile
          - name: user-service
            context: .
            dockerfile: userService/Dockerfile
          - name: restaurant-service
            context: .
            dockerfile: restaurantService/Dockerfile
          - name: order-service
            context: .
            dockerfile: orderService/Dockerfile
          - name: delivery-service
            context: .
            dockerfile: deliveryService/Dockerfile
          - name: payment-service
            context: .
            dockerfile: paymentService/Dockerfile
          - name: notification-service
            context: .
            dockerfile: notificationService/Dockerfile
          - name: search-service
            context: .
            dockerfile: searchService/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nmaksimka/delivery-hub-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
