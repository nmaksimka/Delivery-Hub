syntax = "proto3";

package deliveryhub.pricing.v1;

option java_multiple_files = true;
option java_package = "com.deliveryhub.contracts.pricing";
option java_outer_classname = "MenuPricingProto";

service MenuPricing {
  rpc Quote(QuoteRequest) returns (QuoteResponse);
}

message QuoteRequest {
  int64 restaurant_id = 1;
  repeated int64 menu_item_ids = 2;
}

message QuoteResponse {
  int64 restaurant_id = 1;
  string restaurant_name = 2;
  bool restaurant_active = 3;
  repeated QuotedItem items = 4;
  bool restaurant_closed = 5;
  string opens_at = 6;
  string closes_at = 7;
  string time_zone = 8;
}

message QuotedItem {
  int64 menu_item_id = 1;
  ItemStatus status = 2;
  string name = 3;
  string price = 4;
}

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_AVAILABLE = 1;
  ITEM_STATUS_UNAVAILABLE = 2;
  ITEM_STATUS_NOT_FOUND = 3;
  ITEM_STATUS_OTHER_RESTAURANT = 4;
}
