server:
  port: 3331

spring:
  application:
    name: restaurantService
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:local-dev-config-password}
  grpc:
    server:
      port: ${GRPC_PORT:9331}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5331}/${DB_NAME:restaurant_db}
    username: ${DB_USER:restaurant_user}
    password: ${DB_PASSWORD:restaurant_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
    consumer:
      group-id: restaurant-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      avro.use.logical.type.converters: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      enable-statistics: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

app:
  internal-token: ${INTERNAL_TOKEN:local-dev-internal-token}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:3900}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:3900}
    region: garage
    bucket: ${STORAGE_BUCKET:images}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    presign-ttl: 12h
    max-image-size: 5MB
    download-connect-timeout: 2s
    download-read-timeout: 10s
    download-deadline: 30s
    mirror:
      allowed-schemes: https
      allowed-hosts: www.themealdb.com,images.openfoodfacts.org
  catalog-cache:
    ttl: 5m
  import:
    stale-after: 10m
  working-hours:
    zone: Asia/Tomsk
  mealdb:
    base-url: ${MEALDB_BASE_URL:https://www.themealdb.com/api/json/v1/1}
    connect-timeout: 2s
    read-timeout: 5s
    requests-per-second: 5
    rate-limit-wait: 10s
    max-attempts: 3
    retry-backoff: 500ms
    cache-ttl: 6h
    meals-per-category: 12
  foodfacts:
    base-url: ${FOODFACTS_BASE_URL:https://world.openfoodfacts.org}
    user-agent: DeliveryHub/1.0 (student project)
    connect-timeout: 2s
    read-timeout: 10s
    requests-per-second: 2
    rate-limit-wait: 10s
    max-attempts: 3
    retry-backoff: 1s
    cache-ttl: 12h
    products-per-category: 10

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:local-dev-eureka-password}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
