<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="mail(content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${notification.title}">DeliveryHub</title>
</head>
<body style="margin:0;padding:24px;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#111111;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;border-collapse:collapse;">
    <tr>
        <td style="padding:0 0 16px;font-size:22px;font-weight:bold;color:#ff3d00;">DeliveryHub</td>
    </tr>
    <tr>
        <td style="padding:0 0 8px;font-size:20px;font-weight:bold;" th:text="${notification.title}">Заголовок</td>
    </tr>
    <tr>
        <td style="padding:0 0 16px;font-size:15px;line-height:1.5;">
            <p style="margin:0 0 12px;" th:text="${name} ? |${name}, здравствуйте!| : 'Здравствуйте!'">Здравствуйте!</p>
            <div th:replace="${content}">Текст</div>
        </td>
    </tr>
    <tr>
        <td style="padding:16px 0 0;border-top:1px solid #e5e5e5;font-size:12px;color:#777777;">
            Письмо отправлено автоматически, отвечать на него не нужно. Томск, DeliveryHub.
        </td>
    </tr>
</table>
</body>
</html>
