<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: mail(~{::section})}">
<section>
    <p style="margin:0 0 12px;">
        Заказ <b th:text="|№${notification.orderId}|">№1</b> на сумму
        <b th:text="|${#numbers.formatDecimal(notification.amount, 1, 'WHITESPACE', 2, 'COMMA')} ₽|">0,00 ₽</b> принят.
    </p>
    <p style="margin:0;">Как только оплата подтвердится, начнём искать курьера.</p>
</section>
</html>
