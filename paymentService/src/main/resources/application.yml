server:
  port: 3336

spring:
  application:
    name: paymentService
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:local-dev-config-password}
    inetutils:
      ignored-interfaces:
        - .*
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5336}/${DB_NAME:payment_db}
    username: ${DB_USER:payment_user}
    password: ${DB_PASSWORD:payment_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  internal-token: ${INTERNAL_TOKEN:local-dev-internal-token}
  payment:
    provider: ${PAYMENT_PROVIDER:demo}
    demo:
      max-balance: 100000.00

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:local-dev-eureka-password}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
