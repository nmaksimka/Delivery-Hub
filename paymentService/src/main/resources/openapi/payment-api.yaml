openapi: 3.0.3
info:
  title: DeliveryHub Payment API
  version: 1.0.0
servers:
  - url: http://localhost:3335
tags:
  - name: Wallet
  - name: Payments
  - name: InternalPayments
paths:
  /api/payments/wallet:
    get:
      tags: [Wallet]
      operationId: getWallet
      summary: Баланс кошелька
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Кошелёк, при первом обращении создаётся пустым
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          $ref: '#/components/responses/Problem'
  /api/payments/wallet/top-up:
    post:
      tags: [Wallet]
      operationId: topUpWallet
      summary: Пополнить демо-кошелёк
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: '^[\x21-\x7E]{1,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpRequest'
      responses:
        '200':
          description: Кошелёк после пополнения
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/payments/order/{orderId}:
    get:
      tags: [Payments]
      operationId: getOrderPayment
      summary: Платёж по заказу
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/UserId'
        - name: X-User-Role
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Платёж
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /internal/payments/{orderId}/hold:
    post:
      tags: [InternalPayments]
      operationId: holdPayment
      summary: Зарезервировать сумму заказа
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '200':
          description: Сумма зарезервирована, повтор возвращает тот же платёж
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /internal/payments/{orderId}/capture:
    post:
      tags: [InternalPayments]
      operationId: capturePayment
      summary: Списать зарезервированную сумму
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Платёж списан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /internal/payments/{orderId}/release:
    post:
      tags: [InternalPayments]
      operationId: releasePayment
      summary: Снять резерв
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Резерв снят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /internal/payments/{orderId}/refund:
    post:
      tags: [InternalPayments]
      operationId: refundPayment
      summary: Вернуть списанные деньги
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Деньги возвращены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: integer
        format: int64
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TopUpRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 50000
    HoldRequest:
      type: object
      required: [userId, amount]
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
        amount:
          type: number
          minimum: 0.01
          maximum: 9999999999.99
    WalletResponse:
      type: object
      required: [userId, available, held, updatedAt]
      properties:
        userId:
          type: integer
          format: int64
        available:
          type: number
        held:
          type: number
        updatedAt:
          type: string
          format: date-time
    PaymentState:
      type: string
      enum: [HELD, CAPTURED, RELEASED, REFUNDED, REJECTED]
    PaymentResponse:
      type: object
      required: [orderId, userId, amount, status, provider, createdAt, updatedAt]
      properties:
        orderId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        amount:
          type: number
        status:
          $ref: '#/components/schemas/PaymentState'
        provider:
          type: string
        declineReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
